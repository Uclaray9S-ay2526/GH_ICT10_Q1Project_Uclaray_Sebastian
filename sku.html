<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav-Bar</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <!-- BOOTSTRAP-CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- BOOTSTRAP-JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>

    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-sm">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Receipt Generator</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="SKU-section.html">SKU Generator</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="container p-5 mt-3 bg-light text-dark">
            <h3>SKU GENERATOR</h3>
            <form>
                <select id="category">
                    <option value="DRI">Drinks</option>
                </select>

                <input id="product" type="text" placeholder="e.g., Macha Latte"><br>

                <label for="quantity">Stock Quantity</label><br>
                <input id="quantity" type="number" placeholder="e.g., 50"><br>
            </form>

            <div id="result" style="background-color: #e8eade; font-size: 35px;"></div>
            <button type="button" py-click="generate_sku">Generate SKU</button><br>
            <p>________________________________________</p>
            <div id="sku">Your SKU:</div>
        </div>
    </div>

    <footer class="text-center py-3 mt-auto fixed-bottom">
        SKU GENERATOR –– 1st Quarter Project
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
